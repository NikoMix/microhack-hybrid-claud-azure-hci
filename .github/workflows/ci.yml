name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            #node_modules

  terraform:
    name: Terraform validate & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: terraform fmt (all)
        run: terraform fmt -check -recursive .
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: tflint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: validate & lint each Terraform root module
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          if [ ${#dirs[@]} -eq 0 ]; then echo "No Terraform found"; exit 0; fi
          for d in "${dirs[@]}"; do
            case "$d" in */modules/*) echo "skip module dir: $d"; continue;; esac
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            tflint --chdir="$d" --config="${GITHUB_WORKSPACE}/.tflint.hcl"
            echo "::endgroup::"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkov (Terraform)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml
          quiet: true
          soft_fail: true
      - name: gitleaks (secret scan)
        run: |
          ver="$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${ver}/gitleaks_${ver#v}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --config .gitleaks.toml

  actions-lint:
    name: Workflow & shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: shellcheck
        run: |
          shellcheck --version
          mapfile -t files < <(find . -type f -name '*.sh' -not -path '*/.git/*')
          if [ ${#files[@]} -eq 0 ]; then echo "No shell scripts found"; exit 0; fi
          printf 'Linting %d script(s)\n' "${#files[@]}"
          shellcheck --severity=style "${files[@]}"
